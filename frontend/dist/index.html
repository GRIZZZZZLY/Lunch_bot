<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Food Bot - Управление меню</title>

  <!--
    Content Security Policy (defense-in-depth XSS mitigation).
    - script-src: 'self' (Vite bundles) + telegram.org (Telegram WebApp SDK).
    - style-src: 'unsafe-inline' допущён — Tailwind/Radix/inline-стили React.
    - img-src: data:+https: (аватарки/меню-фото с любых HTTPS-источников).
    - connect-src: 'self' (backend в проде на том же origin) + api.telegram.org.
    - object-src/base-uri/form-action ограничены, чтобы заблокировать XSS-эскалации.
    Note: frame-ancestors здесь не задаётся (meta-тег его не поддерживает) —
    при необходимости прописать на Nginx через заголовок Content-Security-Policy.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://telegram.org;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    font-src 'self' data:;
    connect-src 'self' https://telegram.org https://api.telegram.org;
    frame-src https://telegram.org;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">

  <!-- Полностью отключаем кеширование HTML -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- Версия приложения для cache busting -->
  <meta name="app-version" content="2.0.2">
  
  <!-- Preconnect для ускорения загрузки внешних ресурсов -->
  <link rel="preconnect" href="https://telegram.org" crossorigin>
  <link rel="dns-prefetch" href="https://telegram.org">
  
  <!-- Preload критических скриптов -->
  <link rel="preload" href="https://telegram.org/js/telegram-web-app.js" as="script">
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" crossorigin src="/assets/js/index-CEz71Cao.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/js/vendor-C-CFPQ_Z.js">
  <link rel="modulepreload" crossorigin href="/assets/js/animations-BRWAD__p.js">

  <link rel="modulepreload" crossorigin href="/assets/js/query-libs-CC22qS3o.js">
  <link rel="stylesheet" crossorigin href="/assets/css/index-Cc50rPpZ.css">
<link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>

</body>
