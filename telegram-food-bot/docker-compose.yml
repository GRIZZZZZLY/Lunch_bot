version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: foodbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodbot_password}
      POSTGRES_DB: ${POSTGRES_DB:-foodbot_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - foodbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodbot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: foodbot-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-foodbot}:${POSTGRES_PASSWORD:-foodbot_password}@postgres:5432/${POSTGRES_DB:-foodbot_db}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME}
      BOT_WEBHOOK_URL: ${BOT_WEBHOOK_URL:-}
      TELEGRAM_SECRET_KEY: ${TELEGRAM_SECRET_KEY}
      API_PORT: ${API_PORT:-3001}
      API_HOST: ${API_HOST:-0.0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      POLL_DURATION_MINUTES: ${POLL_DURATION_MINUTES:-30}
      AUTO_ROULETTE_ENABLED: ${AUTO_ROULETTE_ENABLED:-true}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - foodbot-network
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME}
    container_name: foodbot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - foodbot-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (required for GlitchTip)
  redis:
    image: redis:7-alpine
    container_name: foodbot-redis
    restart: unless-stopped
    networks:
      - foodbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GlitchTip (Sentry-compatible error tracking)
  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: foodbot-glitchtip
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-foodbot}:${POSTGRES_PASSWORD:-foodbot_password}@postgres:5432/${GLITCHTIP_DB:-glitchtip_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-in-production}
      PORT: 8000
      EMAIL_URL: ${EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@glitchtip.local}
      CELERY_WORKER_AUTOSCALE: ${CELERY_WORKER_AUTOSCALE:-4,1}
      CELERY_WORKER_MAX_TASKS_PER_CHILD: ${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
    ports:
      - "${GLITCHTIP_PORT:-8000}:8000"
    networks:
      - foodbot-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # GlitchTip Worker (background tasks)
  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: foodbot-glitchtip-worker
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - glitchtip
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-foodbot}:${POSTGRES_PASSWORD:-foodbot_password}@postgres:5432/${GLITCHTIP_DB:-glitchtip_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-in-production}
      EMAIL_URL: ${EMAIL_URL:-consolemail://}
      CELERY_WORKER_AUTOSCALE: ${CELERY_WORKER_AUTOSCALE:-4,1}
      CELERY_WORKER_MAX_TASKS_PER_CHILD: ${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10000}
    command: ./bin/run-celery-with-beat.sh
    networks:
      - foodbot-network

volumes:
  postgres_data:
    driver: local

networks:
  foodbot-network:
    driver: bridge
