<!DOCTYPE html>
<html>
<head>
    <title>Auth Debug</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #00ff00;
            border-radius: 8px;
        }
        button {
            background: #00ff00;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 Auth Debug Tool</h1>
    
    <div class="section">
        <h2>LocalStorage:</h2>
        <pre id="localStorage"></pre>
        <button onclick="checkLocalStorage()">Проверить</button>
        <button onclick="clearStorage()">Очистить</button>
    </div>

    <div class="section">
        <h2>Telegram WebApp:</h2>
        <pre id="telegram"></pre>
        <button onclick="checkTelegram()">Проверить</button>
    </div>

    <div class="section">
        <h2>Test API Call:</h2>
        <pre id="apiTest"></pre>
        <button onclick="testAPI()">Тест GET /api/menu</button>
        <button onclick="testAuth()">Тест GET /api/auth/me</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        function checkLocalStorage() {
            const storage = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                storage[key] = localStorage.getItem(key);
            }
            document.getElementById('localStorage').textContent = 
                JSON.stringify(storage, null, 2) || 'Empty';
        }

        function clearStorage() {
            localStorage.clear();
            alert('Storage cleared!');
            checkLocalStorage();
        }

        function checkTelegram() {
            const info = {
                isAvailable: !!window.Telegram?.WebApp,
                initData: window.Telegram?.WebApp?.initData,
                initDataUnsafe: window.Telegram?.WebApp?.initDataUnsafe,
                user: window.Telegram?.WebApp?.initDataUnsafe?.user,
                version: window.Telegram?.WebApp?.version,
            };
            document.getElementById('telegram').textContent = 
                JSON.stringify(info, null, 2);
        }

        async function testAPI() {
            const token = localStorage.getItem('auth_token');
            const output = document.getElementById('apiTest');
            
            try {
                output.textContent = 'Loading...';
                const response = await fetch('http://localhost:3001/api/menu', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    }
                });
                const data = await response.json();
                output.textContent = `Status: ${response.status}\n\n` + 
                    JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }

        async function testAuth() {
            const token = localStorage.getItem('auth_token');
            const output = document.getElementById('apiTest');
            
            try {
                output.textContent = 'Loading...';
                const response = await fetch('http://localhost:3001/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    }
                });
                const data = await response.json();
                output.textContent = `Status: ${response.status}\n\n` + 
                    JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }

        // Auto-check on load
        checkLocalStorage();
        checkTelegram();
    </script>
</body>
</html>
