<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Food Bot</title>
  
  <!-- Telegram WebApp Meta -->
  <meta name="telegram-web-app" content="1">
  <meta name="format-detection" content="telephone=no">
  
  <!-- PWA Meta -->
  <meta name="theme-color" content="#1f2937">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Food Bot">
  
  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  
  <!-- Telegram WebApp Script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Telegram WebApp CSS Variables -->
  <style>
    :root {
      --tg-color-bg: #ffffff;
      --tg-color-text: #222222;
      --tg-color-hint: #999999;
      --tg-color-link: #2481cc;
      --tg-color-button: #2481cc;
      --tg-color-button-text: #ffffff;
      --tg-color-secondary-bg: #f4f4f5;
    }
    
    /* Dark theme variables will be set by Telegram */
    .dark {
      --tg-color-bg: #1a1a1a;
      --tg-color-text: #ffffff;
      --tg-color-hint: #999999;
      --tg-color-link: #3390ec;
      --tg-color-button: #3390ec;
      --tg-color-button-text: #ffffff;
      --tg-color-secondary-bg: #2a2a2a;
    }
    
    body {
      background-color: var(--tg-color-bg);
      color: var(--tg-color-text);
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    
    #root {
      min-height: 100vh;
      background-color: var(--tg-color-bg);
    }
    
    /* Disable text selection */
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    
    /* Enable text selection for inputs */
    input, textarea {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }
    
    /* Telegram WebApp specific styles */
    .tg-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
