<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Очистка кэша</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>🧹 Очистка кэша приложения</h1>
    <p>Нажмите кнопку, чтобы очистить кэш React Query и перезагрузить приложение.</p>
    <button onclick="clearCache()">Очистить кэш</button>
    <div id="result"></div>

    <script>
        function clearCache() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Очистка кэша...';
            resultDiv.className = '';
            
            try {
                // Очищаем localStorage
                localStorage.clear();
                
                // Очищаем sessionStorage
                sessionStorage.clear();
                
                // Очищаем cookies
                document.cookie.split(";").forEach(function(c) { 
                    document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
                });
                
                // Очищаем Service Worker cache
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        for(let registration of registrations) {
                            registration.unregister();
                        }
                    });
                }
                
                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        for (let name of names) {
                            caches.delete(name);
                        }
                    });
                }
                
                resultDiv.textContent = '✅ Кэш успешно очищен! Перезагрузка через 2 секунды...';
                resultDiv.className = 'success';
                
                setTimeout(function() {
                    window.location.href = '/';
                }, 2000);
                
            } catch (error) {
                resultDiv.textContent = '❌ Ошибка при очистке кэша: ' + error.message;
                resultDiv.className = 'error';
            }
        }
    </script>
</body>
</html>
