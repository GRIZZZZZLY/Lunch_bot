<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rocket Lunch — Redesign</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Шрифты self-hosted (public/fonts), объявлены в src/styles/tokens.css.
         Preload — основной Onest и брендовый сабсет: 3 КБ ровно под строку
         «Rocket Lunch» в шапке. Без него заголовок рисовался в Onest и через
         ~250ms подменялся на Unbounded отдельным рывком. Полный латинский
         Unbounded (51 КБ) остался объявленным, но в норме не скачивается —
         см. unicode-range в tokens.css. -->
    <link rel="preload" href="/fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/unbounded-brand.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Логотип шапки: 3 КБ, задаётся инлайновым mask-image, то есть браузер
         узнаёт о нём только после первого рендера React. Preload убирает эту
         задержку — плитка не показывается пустой. -->
    <link rel="preload" href="/logo-rocket.png" as="image" type="image/png" />

    <!-- defer, а не блокирующий: разбор HTML не должен ждать рейса на
         telegram.org. Порядок сохраняется — defer-скрипты и модули выполняются
         в порядке документа, поэтому SDK по-прежнему готов до main.tsx. -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
