<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rocket Lunch — Redesign</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Шрифты self-hosted (public/fonts), объявлены в src/styles/tokens.css.
         Preload — только основной Onest; Unbounded (бренд) грузится по мере надобности. -->
    <link rel="preload" href="/fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- defer, а не блокирующий: разбор HTML не должен ждать рейса на
         telegram.org. Порядок сохраняется — defer-скрипты и модули выполняются
         в порядке документа, поэтому SDK по-прежнему готов до main.tsx. -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
