name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://rocket-lunch.duckdns.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Pre-deployment backup
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.VPS_PROJECT_PATH }}
            ./backup-db.sh || echo "Warning: Backup script not found or failed"
          EOF

      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            
            echo "🚀 Starting deployment..."
            cd ${{ secrets.VPS_PROJECT_PATH }}
            
            # Fetch latest changes
            git fetch --all --tags
            
            # Checkout the specific tag/branch
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG_NAME=${GITHUB_REF#refs/tags/}
              echo "📦 Deploying tag: $TAG_NAME"
              git checkout $TAG_NAME
            else
              echo "📦 Deploying branch: ${{ github.ref_name }}"
              git checkout ${{ github.ref_name }}
              git pull origin ${{ github.ref_name }}
            fi
            
            # Run deployment script
            chmod +x ./deploy-vps.sh
            ./deploy-vps.sh
            
            echo "✅ Deployment completed"
          EOF
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Wait for service to start
        run: sleep 15

      - name: Health check
        run: |
          MAX_ATTEMPTS=10
          ATTEMPT=1
          
          echo "🔍 Running health checks..."
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."
            
            if curl -f -s https://rocket-lunch.duckdns.org/health; then
              echo "✅ Health check passed!"
              exit 0
            fi
            
            echo "❌ Health check failed, retrying in 5 seconds..."
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Verify application endpoints
        run: |
          echo "🔍 Verifying endpoints..."
          
          # Check API health
          curl -f https://rocket-lunch.duckdns.org/api/health || exit 1
          
          # Check frontend
          curl -f https://rocket-lunch.duckdns.org/ || exit 1
          
          echo "✅ All endpoints verified"

      - name: Notify deployment success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: '✅ Deployment Successful',
              attachments: [{
                color: 'good',
                text: `Version: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nEnvironment: ${{ github.event.inputs.environment || 'production' }}\nURL: https://rocket-lunch.duckdns.org`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed, attempting rollback..."
          
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.VPS_PROJECT_PATH }}
            
            # Get previous tag
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Rolling back to: $PREVIOUS_TAG"
              git checkout $PREVIOUS_TAG
              ./deploy-vps.sh
              echo "✅ Rollback completed"
            else
              echo "⚠️ No previous tag found, manual intervention required"
            fi
          EOF

      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: '❌ Deployment Failed',
              attachments: [{
                color: 'danger',
                text: `Version: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nEnvironment: ${{ github.event.inputs.environment || 'production' }}\nAction: Rollback initiated`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  post-deployment-tests:
    name: Post-Deployment Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          echo "🔥 Running smoke tests..."
          
          # Test critical user flows
          # Add your smoke test commands here
          
          echo "✅ Smoke tests passed"
