name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy immutable release
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server host key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Build and activate release
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" bash -s -- \
            "$SERVER_PATH" "$DEPLOY_SHA" "$DEPLOY_REF" <<'ENDSSH'
          set -euo pipefail

          repository=$1
          deploy_sha=$2
          deploy_ref=$3
          release_root="${repository%/}-releases"
          release_dir="$release_root/$deploy_sha"
          current_link="$release_root/current"
          previous_file="$release_root/.previous-release"

          source_project="$repository"
          if [ ! -d "$source_project/backend" ]; then
            source_project="$repository/telegram-food-bot"
          fi
          test -d "$source_project/backend"

          git -C "$repository" fetch --prune origin "$deploy_ref"
          git -C "$repository" rev-parse --verify "$deploy_sha^{commit}" >/dev/null
          mkdir -p "$release_root"

          if [ ! -d "$release_dir" ]; then
            git -C "$repository" worktree add --detach "$release_dir" "$deploy_sha"
          fi

          release_project="$release_dir"
          if [ ! -d "$release_project/backend" ]; then
            release_project="$release_dir/telegram-food-bot"
          fi
          test -d "$release_project/backend"

          test -f "$source_project/backend/.env"
          install -m 600 "$source_project/backend/.env" "$release_project/backend/.env"

          frontend_dir=$(sed -n 's/^FRONTEND_DIR=//p' \
            "$source_project/backend/.env" | tail -1 | tr -d '\r"' | xargs)
          frontend_dir=${frontend_dir:-frontend-new}
          case "$frontend_dir" in
            frontend|frontend-new) ;;
            *) echo "Unsupported FRONTEND_DIR: $frontend_dir" >&2; exit 1 ;;
          esac
          source_frontend="$source_project/$frontend_dir"
          release_frontend="$release_project/$frontend_dir"
          test -d "$source_frontend"
          test -d "$release_frontend"

          if [ -f "$source_frontend/.env" ]; then
            install -m 600 "$source_frontend/.env" "$release_frontend/.env"
          fi
          if [ -f "$source_frontend/.env.production" ]; then
            install -m 600 "$source_frontend/.env.production" \
              "$release_frontend/.env.production"
          fi

          for runtime_dir in uploads logs; do
            mkdir -p "$source_project/backend/$runtime_dir"
            if [ ! -e "$release_project/backend/$runtime_dir" ]; then
              ln -s "$source_project/backend/$runtime_dir" \
                "$release_project/backend/$runtime_dir"
            fi
          done

          (
            cd "$release_project/backend"
            npm ci
            npm run db:generate
            npm run build:prod
          )

          (
            cd "$release_frontend"
            npm ci
            npm run build
          )

          (
            cd "$release_project/backend"
            npm run db:migrate:prod
          )

          if [ -L "$current_link" ]; then
            readlink -f "$current_link" > "$previous_file"
          else
            : > "$previous_file"
          fi

          ln -sfn "$release_dir" "$release_root/current.next"
          mv -Tf "$release_root/current.next" "$current_link"

          pm2 delete rocket-lunch-bot || true
          APP_ROOT="$release_project" \
          BACKEND_ENV_FILE="$release_project/backend/.env" \
            pm2 start "$release_project/ecosystem.config.js" \
              --only rocket-lunch-bot --update-env
          pm2 save

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done

          echo 'Local health check failed' >&2
          exit 1
          ENDSSH

      # Публичная проверка идёт по ПУБЛИЧНОМУ адресу, а не по SERVER_HOST.
      # SERVER_HOST — адрес для ssh (у нас это IP), и https по нему не отвечает:
      # nginx не знает такого имени и отдаёт 421 Misdirected Request. Обратное
      # тоже верно: публичный домен живёт за Cloudflare-туннелем, и ssh туда не
      # проходит. Одно значение для обоих шагов не годится, поэтому адрес
      # health-проверки задаётся отдельно (переменной окружения, не секретом —
      # домен и так публичный).
      - name: Check public health endpoint
        env:
          HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL || 'https://rocketlunch.dpdns.org/health' }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$HEALTH_URL"

  rollback:
    name: Restore previous release
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server host key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Reactivate previous immutable release
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" bash -s -- "$SERVER_PATH" <<'ENDSSH'
          set -euo pipefail

          repository=$1
          release_root="${repository%/}-releases"
          previous_file="$release_root/.previous-release"
          current_link="$release_root/current"
          test -s "$previous_file"

          previous_release=$(cat "$previous_file")
          case "$previous_release" in
            "$release_root"/*) ;;
            *) echo 'Unsafe previous release path' >&2; exit 1 ;;
          esac
          test -d "$previous_release"

          previous_project="$previous_release"
          if [ ! -d "$previous_project/backend" ]; then
            previous_project="$previous_release/telegram-food-bot"
          fi
          test -d "$previous_project/backend"

          ln -sfn "$previous_release" "$release_root/current.next"
          mv -Tf "$release_root/current.next" "$current_link"
          pm2 delete rocket-lunch-bot || true
          APP_ROOT="$previous_project" \
          BACKEND_ENV_FILE="$previous_project/backend/.env" \
            pm2 start "$previous_project/ecosystem.config.js" \
              --only rocket-lunch-bot --update-env
          pm2 save
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            http://127.0.0.1:3001/health >/dev/null
          ENDSSH
