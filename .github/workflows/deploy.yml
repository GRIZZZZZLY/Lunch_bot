name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          echo "🚀 Deploying to ${{ inputs.environment || 'production' }}..."
          
          ssh $SERVER_USER@$SERVER_HOST << 'ENDSSH'
            cd $SERVER_PATH
            
            # Pull latest changes
            echo "📥 Pulling latest changes..."
            git fetch --all
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # Install dependencies
            echo "📦 Installing dependencies..."
            cd backend && npm ci --production
            cd ../frontend && npm ci
            
            # Build frontend
            echo "🏗️  Building frontend..."
            npm run build
            
            # Run database migrations
            echo "🗄️  Running migrations..."
            cd ../backend
            npm run db:migrate:prod
            npm run db:generate
            
            # Restart services
            echo "🔄 Restarting services..."
            pm2 restart telegram-food-bot-backend || pm2 start dist/index.js --name telegram-food-bot-backend
            
            echo "✅ Deployment completed!"
          ENDSSH
      
      - name: Health check
        run: |
          echo "🏥 Running health check..."
          sleep 10
          
          response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.SERVER_HOST }}/api/health)
          
          if [ "$response" = "200" ]; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed! HTTP $response"
            exit 1
          fi
      
      - name: Notify deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅ Success' : '❌ Failed';
            const message = `
              ## Deployment ${status}
              
              **Environment:** ${{ inputs.environment || 'production' }}
              **Ref:** ${{ github.ref_name }}
              **Commit:** ${{ github.sha }}
              **Actor:** @${{ github.actor }}
            `;
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: message
            });

  rollback:
    name: Rollback (if deployment fails)
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: ${{ inputs.environment || 'production' }}
    
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Rollback deployment
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          echo "⏪ Rolling back deployment..."
          
          ssh $SERVER_USER@$SERVER_HOST << 'ENDSSH'
            cd $SERVER_PATH
            
            # Revert to previous commit
            git reset --hard HEAD^
            
            # Restart services
            pm2 restart telegram-food-bot-backend
            
            echo "✅ Rollback completed!"
          ENDSSH
