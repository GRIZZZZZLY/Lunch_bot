name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'

jobs:
  # Проверки уровня репозитория: их нельзя повесить ни на backend, ни на
  # frontend-new, потому что они смотрят на дерево целиком.
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Битая кодировка уже доходила до продакшена: шаблоны уведомлений
      # отдавали пользователям вместо «Голосование завершено!» ту же строку,
      # прочитанную как windows-1251. Ни один тест этого не видит —
      # сравнивать не с чем. Пример порчи — в самом скрипте проверки.
      - name: Check for mojibake
        run: npm run check:mojibake

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodbot_test_db
          POSTGRES_USER: foodbot
          POSTGRES_PASSWORD: foodbot_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodbot -d foodbot_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://foodbot:foodbot_password@localhost:5432/foodbot_test_db
      TEST_DATABASE_URL: postgresql://foodbot:foodbot_password@localhost:5432/foodbot_test_db
      BOT_TOKEN: 000000000:test-token
      TELEGRAM_SECRET_KEY: ci-only-secret
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-characters
      WEBAPP_URL: http://localhost:5173
      FRONTEND_DIR: frontend-new
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Check Prisma formatting
        run: npm run db:format:check

      - name: Verify migrations on an isolated database
        run: npm run db:migrate:test

      - name: Run ESLint
        run: npm run lint

      - name: Check production TypeScript build
        run: npm run build:prod

      - name: Find unused code and dependencies
        run: npm run knip

      - name: Run tests with coverage
        run: npm run test:coverage -- --runInBand

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # Бюджеты производительности и доступности живого интерфейса.
  # Раньше это задание гоняло Lighthouse по СТАРОМУ интерфейсу, которого больше
  # нет; сам прод при этом такими проверками не покрывался вовсе. Браузерные
  # сценарии здесь не дублируются — у frontend-new своё задание Playwright.
  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-new

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend-new/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  frontend-new-quality:
    name: Frontend-new quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-new

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run type-check

      - name: Check Playwright TypeScript
        run: npm run type-check:e2e

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Check bundle size limits
        run: npm run size:check

      - name: Validate production smoke configuration
        env:
          E2E_ALLOW_PRODUCTION: '1'
          E2E_PRODUCTION_BASE_URL: https://example.invalid
          E2E_PRODUCTION_BOT_TOKEN: 000000000:ci-placeholder
          E2E_PRODUCTION_USER_ID: '700000101'
          E2E_PRODUCTION_GROUP_NAME: CI placeholder
        run: npm run test:e2e:production -- --list

  frontend-new-e2e:
    name: Frontend-new Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-new

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run critical mobile paths
        run: npm run test:e2e:smoke

      - name: Run full isolated UI suite
        run: npm run test:e2e:full

      - name: Upload frontend-new Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-new-playwright-report
          path: |
            frontend-new/playwright-report/
            frontend-new/test-results/
          if-no-files-found: ignore
          retention-days: 14

  frontend-new-integration:
    name: Frontend-new + backend + PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodbot_e2e_test
          POSTGRES_USER: foodbot
          POSTGRES_PASSWORD: foodbot_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodbot -d foodbot_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://foodbot:foodbot_password@localhost:5432/foodbot_e2e_test
      TEST_DATABASE_URL: postgresql://foodbot:foodbot_password@localhost:5432/foodbot_e2e_test
      BOT_TOKEN: 777000:test_e2e_bot_token
      E2E_BOT_TOKEN: 777000:test_e2e_bot_token
      TELEGRAM_SECRET_KEY: e2e-only-telegram-secret
      JWT_SECRET: e2e-only-jwt-secret-that-is-at-least-32-characters
      WEBAPP_URL: http://127.0.0.1:3001
      CORS_ORIGIN: http://127.0.0.1:3001
      PROCESS_ROLE: api
      FRONTEND_DIR: frontend-new
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      ENABLE_RATE_LIMIT: 'false'
      E2E_INTEGRATION: '1'
      E2E_INTEGRATION_BASE_URL: http://127.0.0.1:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend-new/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend-new dependencies
        working-directory: frontend-new
        run: npm ci

      - name: Install Chromium
        working-directory: frontend-new
        run: npx playwright install --with-deps chromium

      - name: Generate schema and reset isolated database
        working-directory: backend
        run: |
          npm run db:generate
          npx prisma db push --force-reset --accept-data-loss

      - name: Seed deterministic E2E data
        working-directory: backend
        run: npm run e2e:seed

      - name: Build frontend-new and backend
        run: |
          npm --prefix frontend-new run build
          npm --prefix backend run build:prod

      - name: Start API-only server
        working-directory: backend
        run: |
          npm start > ../e2e-backend.log 2>&1 &
          echo $! > ../e2e-backend.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/health/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat ../e2e-backend.log
          exit 1

      - name: Run real-server contract tests
        working-directory: frontend-new
        run: npm run test:e2e:integration

      - name: Clean E2E data
        if: always()
        working-directory: backend
        run: npm run e2e:cleanup

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-new-integration-report
          path: |
            frontend-new/playwright-report/
            frontend-new/test-results/
            e2e-backend.log
          if-no-files-found: ignore
          retention-days: 14

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit frontend-new dependencies
        working-directory: frontend-new
        run: npm run audit:prod
