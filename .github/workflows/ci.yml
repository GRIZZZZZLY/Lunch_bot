name: CI

on:
  push:
    branches:
      - main
      - feature/store-run
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Find unused code and dependencies
        run: npm run knip

      - name: Run React Doctor
        run: npm run react-doctor

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --run

      - name: Build production bundle
        run: npm run build

      - name: Check bundle size limits
        run: npm run size:check

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodbot_test_db
          POSTGRES_USER: foodbot
          POSTGRES_PASSWORD: foodbot_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodbot -d foodbot_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://foodbot:foodbot_password@localhost:5432/foodbot_test_db
      TEST_DATABASE_URL: postgresql://foodbot:foodbot_password@localhost:5432/foodbot_test_db
      BOT_TOKEN: 000000000:test-token
      TELEGRAM_SECRET_KEY: ci-only-secret
      WEBAPP_URL: http://localhost:5173
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Check Prisma formatting
        run: npm run db:format:check

      - name: Verify migrations on an isolated database
        run: npm run db:migrate:test

      - name: Run ESLint
        run: npm run lint

      - name: Check production TypeScript build
        run: npm run build:prod

      - name: Find unused code and dependencies
        run: npm run knip

      - name: Run tests with coverage
        run: npm run test:coverage -- --runInBand

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Browser, accessibility and Lighthouse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run browser and accessibility tests
        run: npm run test:e2e -- --project=chromium

      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports
          path: |
            frontend/playwright-report/
            frontend/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high
